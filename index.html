<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <title>Продуктовый каталог</title>
    </head>

    <body class="body">
        <main class="product-catalog">
            <h1 class="product-catalog__title">Выбери свой продукт</h1>

            <div class="button_container">
                <button class="button" id="repaint-first-card-button">
                    Изменить цвет 1 карточки
                </button>
                <button class="button" id="repaint-cards-button">
                    Изменить цвет всех карточек
                </button>
                <button class="button" id="open-page-google-button">
                    Открыть страницу Google.com
                </button>
                <button class="button" id="notification-window-button">
                    Всплывающее окно уведомлений
                </button>
                <button class="button" id="repaint-backgroundcolor-button">
                    Изменить цвет кнопки
                </button>
            </div>
            <div class="product-catalog__container">
                <template id="card__template">
                    <!-- Карточка 1 -->
                    <article class="card">
                        <div class="card__img-wrapper">
                            <img class="card__img" />
                        </div>
                        <div class="card__description">
                            <p class="card__properties"></p>
                            <h2 class="card__title"></h2>
                            <p class="card__text-description"></p>
                        </div>
                        <div class="card__compound">
                            <b class="card__compound-title">Состав:</b>
                            <ul class="card__compound-list"></ul>
                        </div>
                        <div class="card__price">
                            <b class="card__price-label">Цена</b>
                            <p class="card__price-value"></p>
                        </div>
                    </article>
                </template>
            </div>
        </main>
        <script type="module" src="./homework-10.js"></script>
        <!-- <script type="module" src="./homework-9.js"></script> -->
        <!-- <script src="./homework-8.js"></script> -->
        <!-- <script src="./homework-7.js"></script>
    <script src="./main.js"></script> -->
    </body>
</html>
